<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rotem 피하기 게임!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #gameContainer {
      position: relative;
    }
    canvas {
      border: 3px solid #fff;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      display: block;
      max-width: 100vw;
      max-height: 70vh;
    }
    
    .ui-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
    }

    .ui-title {
      font-size: 28px;
      font-weight: bold;
      color: #00ff88;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0,255,136,0.5);
    }

    .ui-subtext {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .game-btn {
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: #ff4757;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      box-shadow: 0 4px 15px rgba(255,71,87,0.4);
    }

    .game-btn:hover {
      background: #ff6b81;
      transform: scale(1.05);
    }

    .game-btn:active {
      transform: scale(0.95);
    }

    #gameOverScreen {
      display: none;
    }

    #touchControls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      gap: 10px;
      box-sizing: border-box;
      padding: 0 10px;
    }

    .touch-btn {
      flex: 1;
      padding: 15px 0;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: rgba(0, 255, 136, 0.4);
      border-color: #00ff88;
    }

    .touch-btn.jump {
      background: rgba(255, 71, 87, 0.3);
      border-color: #ff4757;
    }

    .touch-btn.jump:active {
      background: rgba(255, 71, 87, 0.7);
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <div id="startScreen" class="ui-screen">
    <div class="ui-title">Rotem 피하기!</div>
    <div class="ui-subtext">
      떨어지는 Rotem을 요리조리 피하세요!<br><br>
      <b>PC 조작:</b> 방향키 [ ← / → ] , [ Spacebar ]<br>
      <b>모바일 조작:</b> 하단 터치 버튼 사용
    </div>
    <button id="startButtonBtn" class="game-btn">게임 시작</button>
  </div>

  <div id="gameOverScreen" class="ui-screen">
    <div class="ui-title" style="color: #ff4757;">GAME OVER</div>
    <div class="ui-subtext" id="finalScoreText">최종 점수: 0점</div>
    <button id="resetButtonBtn" class="game-btn">다시 하기</button>
  </div>
</div>

<!-- 모바일 전용 터치 컨트롤러 (스페이스바 문구로 수정 완료) -->
<div id="touchControls">
  <div id="btnLeft" class="touch-btn">◀ 왼쪽</div>
  <div id="btnJump" class="touch-btn jump">스페이스바 ␣</div>
  <div id="btnRight" class="touch-btn">오른쪽 ▶</div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScoreText');
    const startButtonBtn = document.getElementById('startButtonBtn');
    const resetButtonBtn = document.getElementById('resetButtonBtn');

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnJump = document.getElementById('btnJump');

    const obstacleImageSources = [
      'rotem1.png',
      'rotem2.png',
      'rotem3.png',
      'rotem4.png',
      'rotem5.png',
      'rotem6.png',
      'rotem7.png'
    ];

    const obstacleImages = obstacleImageSources.map(src => {
      const img = new Image();
      img.src = src;
      return img;
    });

    let isGameStarted = false;
    let isGameOver = false;
    let score = 0;
    let frameCount = 0;

    const groundY = canvas.height - 60;

    const player = {
      x: canvas.width / 2 - 15,
      y: groundY,
      width: 30,
      height: 50,
      speed: 6,
      velocityY: 0,
      gravity: 0.8,
      jumpPower: -13,
      isJumping: false
    };

    const obstacles = [];
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') e.preventDefault();
      keys[e.key] = true;
      keys[e.code] = true;

      if (isGameOver && (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ')) {
        resetGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      keys[e.code] = false;
    });

    function setupTouchButton(element, actionKey) {
      const startAction = (e) => {
        e.preventDefault();
        keys[actionKey] = true;
      };
      const endAction = (e) => {
        e.preventDefault();
        keys[actionKey] = false;
      };

      element.addEventListener('touchstart', startAction, { passive: false });
      element.addEventListener('touchend', endAction, { passive: false });
      element.addEventListener('mousedown', startAction);
      element.addEventListener('mouseup', endAction);
      element.addEventListener('mouseleave', endAction);
    }

    setupTouchButton(btnLeft, 'ArrowLeft');
    setupTouchButton(btnRight, 'ArrowRight');
    setupTouchButton(btnJump, 'Space');

    startButtonBtn.addEventListener('click', startGame);
    resetButtonBtn.addEventListener('click', resetGame);

    let lastImageIndex = -1;

    function createObstacle() {
      const size = Math.random() * 30 + 45;
      
      let randomIndex;
      if (obstacleImages.length > 1) {
        do {
          randomIndex = Math.floor(Math.random() * obstacleImages.length);
        } while (randomIndex === lastImageIndex);
      } else {
        randomIndex = 0;
      }
      
      lastImageIndex = randomIndex;
      const randomImg = obstacleImages[randomIndex];
      
      obstacles.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: Math.random() * 3 + 3 + (score / 120),
        img: randomImg
      });
    }

    function checkCollision(player, obs) {
      const paddingX = obs.width * 0.2;
      const paddingY = obs.height * 0.2;

      const obsHitbox = {
        x: obs.x + paddingX,
        y: obs.y + paddingY,
        width: obs.width - (paddingX * 2),
        height: obs.height - (paddingY * 2)
      };

      return (
        player.x < obsHitbox.x + obsHitbox.width &&
        player.x + player.width > obsHitbox.x &&
        player.y < obsHitbox.y + obsHitbox.height &&
        player.y + player.height > obsHitbox.y
      );
    }

    function drawPlayer(x, y, width, height) {
      const centerX = x + width / 2;

      ctx.fillStyle = '#ffcc99';
      ctx.beginPath();
      ctx.arc(centerX, y + 10, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.fillRect(centerX - 4, y + 8, 2, 3);
      ctx.fillRect(centerX + 2, y + 8, 2, 3);

      ctx.fillStyle = '#00ff88';
      ctx.fillRect(x + 5, y + 19, width - 10, 18);

      ctx.fillStyle = '#ffcc99';
      ctx.fillRect(x + 1, y + 20, 4, 12);
      ctx.fillRect(x + width - 5, y + 20, 4, 12);

      ctx.fillStyle = '#333344';
      if (player.isJumping) {
        ctx.fillRect(x + 6, y + 37, 7, 9);
        ctx.fillRect(x + width - 13, y + 37, 7, 9);
      } else {
        ctx.fillRect(x + 6, y + 37, 7, 13);
        ctx.fillRect(x + width - 13, y + 37, 7, 13);
      }
    }

    function startGame() {
      startScreen.style.display = 'none';
      isGameStarted = true;
      resetGame();
    }

    function resetGame() {
      isGameOver = false;
      score = 0;
      frameCount = 0;
      obstacles.length = 0;
      player.x = canvas.width / 2 - player.width / 2;
      player.y = groundY;
      player.velocityY = 0;
      player.isJumping = false;
      gameOverScreen.style.display = 'none';
      requestAnimationFrame(update);
    }

    function update() {
      if (!isGameStarted || isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (keys['ArrowLeft']) {
        player.x -= player.speed;
      }
      if (keys['ArrowRight']) {
        player.x += player.speed;
      }

      if (keys['Space'] && !player.isJumping) {
        player.velocityY = player.jumpPower;
        player.isJumping = true;
      }

      player.velocityY += player.gravity;
      player.y += player.velocityY;

      if (player.y >= groundY) {
        player.y = groundY;
        player.velocityY = 0;
        player.isJumping = false;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      drawPlayer(player.x, player.y, player.width, player.height);

      frameCount++;
      const spawnRate = Math.max(15, 45 - Math.floor(score / 60));
      if (frameCount % spawnRate === 0) {
        createObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        if (obs.img.complete && obs.img.naturalWidth !== 0) {
          ctx.drawImage(obs.img, obs.x, obs.y, obs.width, obs.height);
        } else {
          ctx.fillStyle = '#ff4757';
          ctx.beginPath();
          ctx.arc(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, 0, Math.PI * 2);
          ctx.fill();
        }

        if (checkCollision(player, obs)) {
          isGameOver = true;
          finalScoreText.innerText = `최종 점수: ${score}점`;
          gameOverScreen.style.display = 'flex';
        }

        if (obs.y > canvas.height) {
          obstacles.splice(i, 1);
          score += 10;
        }
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`SCORE: ${score}`, 15, 35);

      requestAnimationFrame(update);
    }
  });
</script>

</body>
</html>
